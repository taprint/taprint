name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compliance:
    name: forbidden-content & license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: negative-control self-test
        run: python3 tools/test_compliance.py
      - name: forbidden-content scan
        run: python3 tools/forbidden_scan.py . --report scan-report.json
      - name: ZPL anti-backflow gate (ADR-0001)
        run: |
          bad=$(grep -rl "ZplRenderer\|LabelaryClient" packages/taprint-java/src --include="*.java"; find packages/taprint-java/src -iname "*zpl*" -type f)
          if [ -n "$bad" ]; then echo "::error::ZPL sources must not enter the repository before v0.2 (ADR-0001): $bad"; exit 1; fi
      - name: license header check
        run: python3 tools/header_check.py .
      - name: upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: scan-report.json
          if-no-files-found: ignore

  ts:
    name: TypeScript kernel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/taprint-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  cs:
    name: C# kernel
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test packages/taprint-cs/Taprint.PrintDsl.Tests/Taprint.PrintDsl.Tests.csproj --logger "console;verbosity=detailed" 2>&1 |
          tee cs-test.log || { grep -E "Failed [^ ]|Error Message|Expected|Actual" cs-test.log >> "$GITHUB_STEP_SUMMARY" || true; exit 1; }

  dart:
    name: Dart kernel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/taprint-dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test --reporter github

  java:
    name: Java kernel
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -f packages/taprint-java/pom.xml test
