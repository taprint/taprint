name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compliance:
    name: forbidden-content & license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: negative-control self-test
        run: python3 tools/test_compliance.py
      - name: forbidden-content scan
        run: python3 tools/forbidden_scan.py . --report scan-report.json
      - name: license header check
        run: python3 tools/header_check.py .
      - name: upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: scan-report.json
          if-no-files-found: ignore

  ts:
    name: TypeScript kernel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/taprint-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  cs:
    name: C# kernel
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test packages/taprint-cs/Taprint.PrintDsl.Tests/Taprint.PrintDsl.Tests.csproj

  dart:
    name: Dart kernel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/taprint-dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  # java: packages/taprint-java — JDK 17 / maven                 (lands with the Java batch)
