name: release

# One tag, four registries (ADR-0005 / release checklist):
#   npm  : taprint + taprint-mcp           (NPM_TOKEN secret)
#   NuGet: Taprint.PrintDsl, Taprint.Channel.Windows
#          (Trusted Publishing OIDC — no secret, bound to this workflow)
#   Maven: io.github.taprint:taprint-java  (CENTRAL_PORTAL_* secrets)
#   pub  : deferred to a dedicated batch (dart SDK job), by maintainers
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # NuGet trusted publishing

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 tools/test_compliance.py
      - run: python3 tools/forbidden_scan.py .
      - run: python3 tools/header_check.py .
      - name: pack metadata five-point check (ts)
        run: |
          cd packages/taprint-ts && npm pkg get name version license repository.url publishConfig.access

  npm:
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org }
      - run: npm install --no-audit --no-fund
      - run: (cd packages/taprint-ts && npm test)
      - run: (cd apps/mcp && npm run build --if-present)
      - run: (cd packages/taprint-ts && npm publish --access public)
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - run: (cd apps/mcp && npm publish --access public)
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }

  nuget:
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    env: { TZ: UTC }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet test packages/taprint-cs/Taprint.PrintDsl.Tests/Taprint.PrintDsl.Tests.csproj
      - run: dotnet pack packages/taprint-cs/Taprint.PrintDsl -c Release -o artifacts
      - run: dotnet pack channels/windows-spooler/Taprint.Channel.Windows -c Release -o artifacts
      - run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json
        # Trusted Publishing: policy bound to owner=taprint repo=taprint workflow=release.yml

  maven:
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    env: { TZ: UTC }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - run: mvn -B -f packages/taprint-java/pom.xml deploy -DskipTests=false
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  github-release:
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate-release-notes: true
